<svg xmlns="http://www.w3.org/2000/svg" width="838" height="48" viewBox="0 0 838 48" role="img"><title>Selected work</title><desc>Selected work: CaseVox, Sesión Agendada, FloorPlanAI.</desc><foreignObject x="0" y="0" width="838" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="t" style="width:838px;height:48px"><style><![CDATA[
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: block; src: url(data:font/woff2;base64,) format("woff2"); }
.t { --bg: #020202; --bg-elev: #090909; --fg: #f2f2f2; --fg-muted: #b1b1b1; --fg-faint: #717171; --line: rgba(222, 222, 222, 0.16); --line-strong: rgba(222, 222, 222, 0.32); --invert-bg: #e4e4e4; --invert-fg: #030303; --live: #47c86e; --glow: rgba(242, 242, 242, 0.55); }

.t {
	--display: "Newsreader", Georgia, serif;
	--body: "Inter", system-ui, sans-serif;
	--mono: "JetBrains Mono", ui-monospace, monospace;
	--ease: cubic-bezier(0.16, 1, 0.3, 1);
	font: 14px/1.5 var(--body);
	-webkit-font-smoothing: antialiased;
}
.t * { box-sizing: border-box; }
.card {
	background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
	position: relative; overflow: hidden; font-family: var(--body);
}
.card::after {
	content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.05;
	background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.pad { padding: 36px; }
/* the portfolio's two label tiers: .mono / scene heads (12px, 0.26em) and .note-sized small labels (11px, 0.2em) */
.mono { font: 400 12px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 0.26em; color: var(--fg-muted); }
.note { font-size: 11px; letter-spacing: 0.2em; color: var(--fg-faint); }
.tnum { font-variant-numeric: tabular-nums; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.tagline { display: inline-flex; align-items: center; gap: 16px; color: var(--fg); }
.gdot { width: 8px; height: 8px; margin-inline: 5px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--line-strong), 0 0 10px 1px var(--glow); flex: none; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px 1px var(--live); flex: none; }
.serif { font-family: var(--display); font-weight: 400; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
.stamp { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.2em; color: var(--fg-faint); }
.stamp .live { width: 6px; height: 6px; }
@media (prefers-reduced-motion: no-preference) {
	.gdot { animation: glow 2.8s ease-in-out infinite; }
	.live { animation: live 2.4s ease-in-out infinite; }
}
@keyframes glow { 50% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--line-strong), 0 0 18px 4px var(--glow); } }
@keyframes live { 50% { box-shadow: 0 0 14px 3px var(--live); } }
@keyframes fadein { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .t *, .t *::before, .t *::after { animation: none !important; transition: none !important; } }


.strip { padding: 14px 36px; }
.work { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
.wcard { display: flex; flex-direction: column; gap: 18px; padding: 22px; color: var(--fg); min-width: 0; }
.wmeta { font-size: 11px; letter-spacing: 0.2em; color: var(--fg-faint); }
.wcard h4 { font-size: 32px; line-height: 1; margin: 8px 0 0; white-space: nowrap; letter-spacing: -0.03em; }
.wcard .kind { margin: 8px 0 0; font: italic 400 18px/1.2 var(--display); letter-spacing: -0.01em; color: var(--fg-muted); }
.wcard p.d { margin: 0; font: 400 13.5px/1.6 var(--body); color: var(--fg-muted); }
.badges { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.badges li { font: 400 11px/1.6 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); padding: 5px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); white-space: nowrap; }
.go { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); font: 400 11px/1 var(--mono); letter-spacing: 0.04em; }
.go > span { color: var(--fg-faint); letter-spacing: 0.2em; text-transform: uppercase; font-size: 11px; white-space: nowrap; }
.go b { display: inline-flex; align-items: center; gap: 8px; font-weight: 400; color: var(--fg); white-space: nowrap; min-width: 0; }
.go svg { width: 12px; height: 12px; }
]]></style><div xmlns="http://www.w3.org/1999/xhtml" class="card strip" style="width: 838px; height: 48px;"><div class="head"><span class="mono tagline"><i class="gdot"></i>Selected work</span><span class="mono">Client &amp; final-year work</span></div></div></div></foreignObject></svg>